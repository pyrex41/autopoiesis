<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER — layout-feasibility experiment</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #aether-root { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #04060e;
        color: #d0daf0;
        font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
      }

      .aether-root { position: relative; width: 100%; height: 100%; }
      .aether-canvas {
        width: 100vw; height: 100vh; display: block; touch-action: none;
        background: #04060e;
      }

      /* ── hover HUD (small floating card near cursor) ───────────────── */
      .aether-hud {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        background: rgba(8, 12, 24, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 8px 10px;
        min-width: 180px;
        max-width: 220px;
        color: #c0cce5;
        line-height: 1.35;
        letter-spacing: 0.02em;
      }
      .aether-hud-card { display: flex; flex-direction: column; gap: 2px; }
      .aether-hud-id {
        font-size: 10px;
        color: #7d8aa8;
        margin-bottom: 4px;
        letter-spacing: 0.1em;
      }
      .aether-hud-row { display: flex; justify-content: space-between; font-size: 11px; }
      .aether-hud-row .k { color: #65728e; }
      .aether-hud-row .v { color: #d8e3f6; }

      /* ── pinned detail panel (right side) ─────────────────────────── */
      .aether-panel {
        position: fixed;
        top: 32px;
        right: 32px;
        width: 320px;
        max-height: calc(100vh - 64px);
        overflow-y: auto;
        z-index: 20;
        background: rgba(6, 10, 22, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 14px 16px;
        color: #c8d4ec;
        line-height: 1.5;
        letter-spacing: 0.02em;
      }
      .aether-panel-head {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 4px;
      }
      .aether-panel-title {
        font-size: 10px; letter-spacing: 0.22em; color: #65728e;
      }
      .aether-panel-close {
        background: transparent; border: none; color: #65728e;
        cursor: pointer; font-size: 14px; padding: 0 4px;
      }
      .aether-panel-close:hover { color: #d8e3f6; }
      .aether-panel-id {
        font-size: 11px; color: #d8e3f6; word-break: break-all;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .aether-section { margin-bottom: 14px; }
      .aether-section:last-child { margin-bottom: 0; }
      .aether-section-title {
        font-size: 10px; letter-spacing: 0.2em; color: #4f5b75;
        text-transform: lowercase; margin-bottom: 6px;
      }
      .aether-row {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: 11px; padding: 2px 0;
      }
      .aether-row .k { color: #65728e; }
      .aether-row .v { color: #d8e3f6; text-align: right; }
      .aether-row .v.mono-small { font-size: 10px; }
      .aether-children-label {
        font-size: 10px; color: #4f5b75; margin: 6px 0 4px;
        letter-spacing: 0.1em;
      }
      .aether-children {
        display: flex; flex-wrap: wrap; gap: 4px 6px;
      }
      .aether-child {
        font-size: 10px; padding: 1px 4px;
        background: rgba(255,255,255,0.04);
      }
      .aether-link {
        color: #9ab5e0; cursor: pointer; text-decoration: none;
        border-bottom: 1px dotted rgba(154, 181, 224, 0.3);
      }
      .aether-link:hover { color: #d8e3f6; border-bottom-color: #d8e3f6; }
      .aether-panel-foot {
        margin-top: 12px;
        font-size: 10px; color: #4f5b75;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }
      .aether-panel-foot kbd {
        font-family: inherit;
        background: rgba(255,255,255,0.07);
        padding: 0 4px;
      }

      /* ── status bar (bottom-left, persistent) ─────────────────────── */
      .aether-status {
        position: fixed; left: 24px; bottom: 18px; z-index: 5;
        font-size: 10px; letter-spacing: 0.18em;
        color: #5b6884; pointer-events: none;
        display: flex; gap: 8px; align-items: baseline;
        text-transform: lowercase;
      }
      .aether-status .sep { color: #2e374a; }
      .aether-status .dim { color: #3d4863; }
      .aether-status .warn { color: #c98c5c; }

      /* ── mood color accents (consistent with spectralClass hues) ──── */
      .mood-linear   { color: #e6d28a; }   /* yellow-white */
      .mood-explorer { color: #9bc3f5; }   /* blue-white   */
      .mood-reflector{ color: #e08c7a; }   /* warm red     */

      /* ── prompt bar (top-center; only visible when toggled with /) ── */
      .aether-prompt {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: min(540px, calc(100vw - 64px));
        pointer-events: none;
      }
      .aether-prompt.open {
        pointer-events: auto;
      }
      .aether-prompt-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 14px;
        background: rgba(8, 12, 24, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #65728e;
        text-transform: lowercase;
      }
      .aether-prompt-label { color: #9bc3f5; }
      .aether-prompt-close {
        background: transparent; border: none; color: #65728e;
        cursor: pointer; font-size: 14px; padding: 0 4px;
      }
      .aether-prompt-close:hover { color: #d8e3f6; }
      .aether-prompt-input {
        width: 100%;
        padding: 14px 16px;
        font-family: inherit;
        font-size: 14px;
        color: #d8e3f6;
        background: rgba(6, 10, 22, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: none;
        outline: none;
        letter-spacing: 0.01em;
      }
      .aether-prompt-input::placeholder { color: #4f5b75; }
      .aether-prompt-input:disabled { opacity: 0.55; }
      .aether-prompt-foot {
        padding: 6px 14px 9px;
        background: rgba(6, 10, 22, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      .aether-prompt-hint { color: #4f5b75; }
      .aether-prompt-err { color: #c98c5c; }

      /* ── live-connection accents on the status bar ─────────────────── */
      .aether-status .live-on  { color: #6fc78f; }
      .aether-status .live-off { color: #c98c5c; }

      /* ── filesystem section in the detail panel ───────────────────── */
      .aether-files-empty {
        font-size: 10px;
        color: #4f5b75;
        font-style: italic;
      }
      .aether-files-list {
        margin-top: 8px;
        max-height: 200px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .aether-file-row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        padding: 2px 0;
        gap: 8px;
      }
      .aether-file-path {
        color: #b8c4dc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }
      .aether-file-size {
        color: #4f5b75;
        flex-shrink: 0;
      }
      .aether-files-more {
        font-size: 10px;
        color: #4f5b75;
        margin-top: 4px;
        font-style: italic;
      }
      .aether-checkout-btn {
        margin-top: 10px;
        width: 100%;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: lowercase;
        background: rgba(154, 195, 245, 0.08);
        color: #9bc3f5;
        border: 1px solid rgba(154, 195, 245, 0.25);
        cursor: pointer;
        text-align: left;
      }
      .aether-checkout-btn:hover {
        background: rgba(154, 195, 245, 0.15);
        color: #d8e3f6;
        border-color: #9bc3f5;
      }
      .aether-checkout-btn:active {
        background: rgba(154, 195, 245, 0.25);
      }
      .aether-reveal-btn {
        margin-top: 6px;
        width: 100%;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: lowercase;
        background: rgba(111, 199, 143, 0.08);
        color: #6fc78f;
        border: 1px solid rgba(111, 199, 143, 0.25);
        cursor: pointer;
        text-align: left;
      }
      .aether-reveal-btn:hover {
        background: rgba(111, 199, 143, 0.16);
        color: #c5e8d0;
        border-color: #6fc78f;
      }

      /* ── content view (full text of the selected step) ────────────── */
      .aether-content-view {
        margin: 4px 0 0;
        max-height: 280px;
        overflow: auto;
        padding: 8px 10px;
        background: rgba(6, 10, 22, 0.6);
        border-left: 1px solid rgba(154, 195, 245, 0.18);
        font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
        font-size: 10px;
        line-height: 1.5;
        color: #c8d4ec;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ── transient toast (checkout confirmation, errors) ──────────── */
      .aether-toast {
        position: fixed;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 40;
        padding: 10px 18px;
        font-size: 11px;
        letter-spacing: 0.08em;
        background: rgba(6, 10, 22, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        animation: aetherToastIn 0.18s ease-out;
      }
      .aether-toast-ok  { color: #6fc78f; border-left: 2px solid #6fc78f; }
      .aether-toast-err { color: #e08c7a; border-left: 2px solid #e08c7a; }
      @keyframes aetherToastIn {
        from { opacity: 0; transform: translate(-50%, 8px); }
        to   { opacity: 1; transform: translate(-50%, 0); }
      }

      /* ── per-line blame view (aether-blame) ───────────────────────── */
      .aether-file-row {
        cursor: pointer;
        border-left: 2px solid transparent;
        padding-left: 4px;
        transition: background 0.1s, border-color 0.1s;
      }
      .aether-file-row:hover {
        background: rgba(154, 195, 245, 0.06);
        border-left-color: rgba(154, 195, 245, 0.35);
      }
      .aether-file-row.expanded {
        background: rgba(154, 195, 245, 0.1);
        border-left-color: #9bc3f5;
      }
      .aether-blame-view {
        max-height: 360px;
        overflow-y: auto;
        margin: 4px 0 8px 0;
        padding: 4px 0;
        background: rgba(6, 10, 22, 0.55);
        border-left: 1px solid rgba(154, 195, 245, 0.18);
        font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
        font-size: 10px;
      }
      .aether-blame-empty {
        padding: 6px 8px;
        color: #4f5b75;
        font-style: italic;
        font-size: 10px;
      }
      .aether-blame-line {
        display: grid;
        grid-template-columns: 28px 1fr 110px;
        gap: 6px;
        align-items: baseline;
        padding: 0 6px;
        line-height: 1.4;
      }
      .aether-blame-line.run-start {
        margin-top: 1px;
        padding-top: 1px;
      }
      .aether-blame-num {
        color: #4f5b75;
        text-align: right;
        user-select: none;
        font-size: 9px;
      }
      .aether-blame-text {
        color: #b8c4dc;
        white-space: pre;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .aether-blame-origin {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #8a9cbf;
        cursor: pointer;
        font-size: 9px;
        letter-spacing: 0.04em;
        overflow: hidden;
      }
      .aether-blame-origin:hover {
        color: #d8e3f6;
      }
      .aether-blame-origin-id {
        font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
        color: #9bc3f5;
      }
      .aether-blame-origin-type {
        color: #4f5b75;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .aether-blame-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .aether-blame-origin-bar {
        display: block;
        width: 2px;
        height: 12px;
        margin-left: 2px;
        background: rgba(154, 195, 245, 0.18);
      }
      /* ── sibling-fork comparison modal ─────────────────────────────── */
      .aether-compare-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(4, 6, 14, 0.74);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        animation: aetherCompareIn 0.16s ease-out;
      }
      .aether-compare-modal {
        background: rgba(8, 12, 24, 0.94);
        color: #d8e3f6;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        max-width: 920px;
        width: 100%;
        max-height: 88vh;
        overflow-y: auto;
        padding: 22px 26px 18px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      }
      @keyframes aetherCompareIn {
        from { opacity: 0; transform: scale(0.985); }
        to   { opacity: 1; transform: scale(1); }
      }
      .aether-compare-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .aether-compare-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .aether-compare-id {
        padding: 4px 9px;
        background: rgba(154, 195, 245, 0.08);
        color: #9bc3f5;
      }
      .aether-compare-id.a-side { color: #9bc3f5; }
      .aether-compare-id.b-side { color: #e6c389; }
      .aether-compare-vs {
        color: rgba(216, 227, 246, 0.4);
        letter-spacing: 0.2em;
      }
      .aether-compare-close {
        background: none;
        border: none;
        color: rgba(216, 227, 246, 0.6);
        font-size: 14px;
        cursor: pointer;
        padding: 4px 8px;
      }
      .aether-compare-close:hover { color: #d8e3f6; }
      .aether-compare-section {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(154, 195, 245, 0.08);
      }
      .aether-compare-section:first-of-type {
        border-top: none;
        padding-top: 0;
        margin-top: 0;
      }
      .aether-compare-section-title {
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(216, 227, 246, 0.5);
        margin-bottom: 10px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .aether-compare-count {
        color: rgba(216, 227, 246, 0.4);
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .aether-compare-row {
        display: grid;
        grid-template-columns: 110px 1fr 1fr;
        gap: 14px;
        padding: 3px 0;
        align-items: baseline;
      }
      .aether-compare-row .k {
        color: rgba(216, 227, 246, 0.45);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .aether-compare-row .v {
        color: #d8e3f6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .aether-compare-row .v.a-side { color: #9bc3f5; }
      .aether-compare-row .v.b-side { color: #e6c389; }
      .aether-compare-row .v.mono-small {
        font-size: 10px;
        color: rgba(216, 227, 246, 0.7);
      }
      .aether-compare-edits {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .aether-compare-edit {
        display: grid;
        grid-template-columns: 70px 110px 1fr;
        gap: 10px;
        padding: 3px 6px;
        font-size: 10.5px;
        background: rgba(154, 195, 245, 0.03);
      }
      .aether-compare-edit-type {
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 10px;
      }
      .aether-compare-edit.edit-replace .aether-compare-edit-type { color: #e6c389; }
      .aether-compare-edit.edit-insert  .aether-compare-edit-type { color: #6fc78f; }
      .aether-compare-edit.edit-delete  .aether-compare-edit-type { color: #e08c7a; }
      .aether-compare-edit-path {
        color: rgba(216, 227, 246, 0.55);
        font-size: 10px;
      }
      .aether-compare-edit-summary {
        color: #d8e3f6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .aether-compare-fs-group {
        margin-bottom: 6px;
      }
      .aether-compare-fs-row {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        gap: 10px;
        padding: 2px 6px;
        font-size: 10.5px;
      }
      .aether-compare-fs-group.added   .op { color: #6fc78f; }
      .aether-compare-fs-group.removed .op { color: #e08c7a; }
      .aether-compare-fs-group.changed .op { color: #e6c389; }
      .aether-compare-fs-row .path {
        color: #d8e3f6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .aether-compare-fs-row .size {
        color: rgba(216, 227, 246, 0.45);
        font-size: 10px;
      }
      .aether-compare-empty {
        color: rgba(216, 227, 246, 0.45);
        font-style: italic;
        padding: 4px 6px;
      }
      .aether-compare-err {
        color: #e08c7a;
        padding: 8px 6px;
        border-left: 2px solid #e08c7a;
      }
      .aether-compare-foot {
        margin-top: 18px;
        padding-top: 10px;
        border-top: 1px solid rgba(154, 195, 245, 0.08);
        font-size: 10px;
        color: rgba(216, 227, 246, 0.4);
        letter-spacing: 0.08em;
      }
      .aether-compare-foot kbd {
        background: rgba(154, 195, 245, 0.1);
        padding: 1px 6px;
        font-family: inherit;
        font-size: 10px;
        margin-right: 4px;
      }

    </style>
  </head>
  <body>
    <div id="aether-root"></div>
    <script type="module" src="/src/aether-entry.tsx"></script>
  </body>
</html>
