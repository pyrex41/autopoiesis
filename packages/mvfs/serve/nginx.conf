# serve/nginx.conf — mvfs read tier (spec/04 §B.6.3; agentzh docs 27/31).
# "Brain decides, nginx serves zero-copy." The /read location runs the shen-lua
# decision in access_by_lua; the /cas/serve location is INTERNAL and sendfile()s
# the blob. No blob byte ever enters the Lua VM.
#
# Deployment artifact (requires OpenResty + lua-resty-mlcache + lua-resty-lock).
# The decision logic is the shen-lua brain (test/read.sh); token verify is
# serve/verify.lua (test/read-edge.sh). Build with luajit2 GC64 (verify: luajit -v).

worker_processes auto;

events { worker_connections 16384; }

http {
    # ---- zero-copy serve knobs (agentzh F3) ----
    sendfile           on;       # kernel DMA disk->socket; only meaningful if bytes stay out of Lua
    tcp_nopush         on;
    aio                threads;  # size-gated below: large blobs must not block the worker (F3 footgun 3)
    directio           4m;

    # CAS files are immutable & append-only (GC unlinks, never overwrites in place,
    # F3 footgun 1) -> the fd/stat cache can be long and large safely.
    open_file_cache          max=200000 inactive=300s;
    open_file_cache_valid    300s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # mlcache backing dicts (L2, cross-worker, shmem — NOT the Lua GC heap, F2/F5).
    lua_shared_dict mvfs_resolve_dict 256m;
    lua_shared_dict mvfs_acl_dict     128m;
    lua_shared_dict mvfs_nonce_dict    64m;   # single-use serve-token nonces (I9)
    lua_shared_dict mvfs_lock          16m;   # lua-resty-lock (stampede single-flight, F4)

    lua_package_path "/opt/mvfs/?.lua;;";

    server {
        listen 443 ssl http2;
        # kTLS for zero-copy WITH encryption (agentzh F3; doc 31 §5). Needs OpenSSL 3
        # + nginx built for kTLS. Without it the TLS edge is CPU-bound on encryption
        # (do NOT claim zero-copy at the TLS edge); use a UDS cleartext internal hop.
        ssl_conf_command Options KTLS;

        # Strip inbound smuggling vectors on every edge (spec/04 §B.6; I9).
        # X-Accel-* and the serve token must NEVER come from the client.
        more_clear_input_headers "X-Accel-Redirect" "X-Accel-*" "X-Mvfs-Serve-Token";

        # ---- client-facing read: DECIDE only ----
        location = /read {
            access_by_lua_block {
                local handle = require "mvfs.access"
                handle()
            }
            # access_by_lua either fails closed (403/503) or ngx.exec's to /cas/serve.
            return 500;   # unreachable: a successful decision always ngx.exec's away
        }

        # ---- internal zero-copy serve: VERIFY token, then sendfile ----
        # `internal;` is MANDATORY and CI-asserted (spec/04 §B.6, agentzh F3/F7):
        # the ONLY way in is the post-authz ngx.exec above.
        location = /cas/serve {
            internal;
            access_by_lua_block {
                local V = require "mvfs.verify"
                local blob  = ngx.var.arg_h                          -- server-derived, not client
                local token = ngx.var.http_x_mvfs_serve_token
                local princ = ngx.ctx.principal
                local racl  = require("mvfs.brain").required_acl(blob)
                if not V.verify(os.getenv("MVFS_SERVE_KEY"), token, blob, princ, racl, "mvfs_nonce_dict") then
                    return ngx.exit(ngx.HTTP_FORBIDDEN)              -- fail closed
                end
            }
            alias /var/mvfs/cas/$arg_h;                              -- blob-hash -> file on disk
            add_header Cache-Control "public, immutable, max-age=31536000";  -- blobs only; never on private (S2)
        }

        # ---- public requests to /cas/ get nothing (no hash-only byte path, I9) ----
        location ^~ /cas/ { return 404; }
    }
}
